# PR / merge gate aligned with docs/VERIFICATION.md (chronon-backend + teaching
# host + chronon-app SSR + Playwright).
# Standalone checkout — UF deps resolve via git branch = main on unified-field-dev.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 1
  CARGO_TARGET_DIR: target-chronon-uf-app
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: "0"
  RUST_BACKTRACE: 1
  # Leptos workspace deps enable the `nightly` feature.
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (pin)
        with:
          toolchain: nightly
          components: rustfmt
      - name: cargo fmt --check
        run: >
          cargo fmt -p chronon-backend -p chronon-app -p protected-chronon-host
          -p chronon-uf-app-e2e -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (pin)
        with:
          toolchain: nightly
          components: clippy
      - name: cargo clippy (backend + teaching host)
        run: |
          cargo clippy -p chronon-backend --all-targets -- -D warnings
          cargo clippy -p protected-chronon-host --all-targets -- -D warnings
      - name: cargo clippy (chronon-app SSR)
        run: |
          cargo clippy -p chronon-app --features ssr --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (pin)
        with:
          toolchain: nightly
          targets: wasm32-unknown-unknown
      - name: cargo test (chronon-backend)
        run: cargo test -p chronon-backend
      - name: cargo check (chronon-app + e2e host SSR)
        run: |
          cargo check -p chronon-app --features ssr
          cargo check -p chronon-uf-app-e2e --features ssr
      - name: cargo check + run (protected-chronon-host)
        run: |
          cargo check -p protected-chronon-host
          cargo run -p protected-chronon-host

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Free disk space
        run: bash scripts/ci-free-disk.sh
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (pin)
        with:
          toolchain: nightly
          targets: wasm32-unknown-unknown
      - name: Install cargo-leptos
        run: cargo install cargo-leptos --locked --version 0.3.6
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: chronon-uf-app-e2e/end2end/package-lock.json
      - name: Install npm dependencies
        working-directory: chronon-uf-app-e2e/end2end
        run: npm ci
      - name: Get Playwright version
        id: pw-version
        working-directory: chronon-uf-app-e2e/end2end
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> $GITHUB_OUTPUT
      - uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}-chronon-uf-app
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: chronon-uf-app-e2e/end2end
        run: npx playwright install --with-deps chromium
      - name: Install Playwright OS deps when cache hit
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: chronon-uf-app-e2e/end2end
        run: npx playwright install-deps chromium
      - name: cargo leptos build (server then frontend)
        env:
          CI: true
        run: |
          # Serialize SSR + WASM so the runner does not compile two Orbital graphs at once
          # (parallel compile OOM/kill → exit 143).
          cargo leptos build --project chronon-uf-app-e2e --server-only
          cargo leptos build --project chronon-uf-app-e2e --frontend-only
      - name: cargo leptos end-to-end
        env:
          CI: true
        run: cargo leptos end-to-end --project chronon-uf-app-e2e
      - name: Upload Playwright artifacts on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-artifacts-chronon-uf-app-${{ github.run_id }}
          path: |
            chronon-uf-app-e2e/end2end/playwright-report/
            chronon-uf-app-e2e/end2end/test-results/
          if-no-files-found: ignore

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (pin)
        with:
          toolchain: nightly
      - name: cargo doc (chronon-backend, deny broken intra-doc links)
        env:
          RUSTDOCFLAGS: "-D rustdoc::broken-intra-doc-links"
        run: cargo doc -p chronon-backend --no-deps

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Security audit
        run: |
          cargo install cargo-audit --locked
          cargo audit

  leptos-lints:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Free disk space
        run: bash scripts/ci-free-disk.sh
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (pin)
        with:
          toolchain: nightly
      - name: Install cargo-dylint
        run: |
          cargo install cargo-dylint --locked --version 6.0.1 --force
          cargo install dylint-link --locked --version 6.0.1 --force
      - name: Install leptos-lints nightly toolchain
        run: rustup toolchain install nightly-2025-05-14 --component rustc-dev,llvm-tools-preview
      - name: cargo dylint (chronon-app hydrate)
        env:
          CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
          RUSTFLAGS: "-D warnings -Zcrate-attr=feature(stdarch_x86_avx512)"
        run: cargo dylint --all -p chronon-app --no-deps -- --features hydrate
